name: Assemble Draft Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows package
    uses: ./.github/workflows/windows-ci.yml

  macos:
    name: Build macOS package
    uses: ./.github/workflows/macos-ci.yml

  linux:
    name: Build Ubuntu packages
    uses: ./.github/workflows/linux-ci.yml

  assemble:
    name: Assemble release assets
    needs:
      - windows
      - macos
      - linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION value: $version" >&2
            exit 1
          fi
          echo "display=$version" >> "$GITHUB_OUTPUT"

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: CacheExplorer-*
          path: release-assets
          merge-multiple: true

      - name: Verify and checksum release assets
        shell: bash
        env:
          CACHEEXPLORER_VERSION: ${{ steps.version.outputs.display }}
        run: |
          set -euo pipefail

          expected_assets=(
            "CacheExplorer-$CACHEEXPLORER_VERSION-Windows-x64.zip"
            "CacheExplorer-$CACHEEXPLORER_VERSION-Windows-x64-Setup.exe"
            "CacheExplorer-$CACHEEXPLORER_VERSION-macOS-arm64.dmg"
            "CacheExplorer-$CACHEEXPLORER_VERSION-Ubuntu-24.04-x86_64.deb"
            "CacheExplorer-$CACHEEXPLORER_VERSION-Ubuntu-26.04-x86_64.deb"
          )

          for asset in "${expected_assets[@]}"; do
            test -f "release-assets/$asset"
          done

          find release-assets -maxdepth 1 -type f -name '*.sha256' -delete
          (
            cd release-assets
            for asset in "${expected_assets[@]}"; do
              sha256sum "$asset"
            done > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload assembled release assets
        uses: actions/upload-artifact@v7
        with:
          name: CacheExplorer-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          CACHEEXPLORER_VERSION: ${{ steps.version.outputs.display }}
        shell: bash
        run: |
          expected_tag="v$CACHEEXPLORER_VERSION"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match VERSION ($expected_tag)." >&2
            exit 1
          fi

          release_heading="$(awk '/^## / { print substr($0, 4); exit }' RELEASE_NOTES.md)"
          if [[ "$release_heading" != "$CACHEEXPLORER_VERSION" ]]; then
            echo "First release-notes section is $release_heading, expected $CACHEEXPLORER_VERSION." >&2
            exit 1
          fi

          awk '
            /^## / {
              section_count++
              if (section_count > 1) {
                exit
              }
            }
            section_count == 1 { print }
          ' RELEASE_NOTES.md > current-release-notes.md

          release_flags=(
            --draft
            --verify-tag
            --title "CacheExplorer ${RELEASE_TAG#v}"
            --notes-file current-release-notes.md
          )
          if [[ "$CACHEEXPLORER_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            "${release_flags[@]}" \
            release-assets/*
